# ---------------------------------------------------------------------------
# محیط توسعه‌ی Base44 برای سفربان (Vite + React SPA در حالت توسعه)
#
# • اپ از سورس کلون‌شده اجرا می‌شود (bind mount) و هیچ ایمیج production بیلد نمی‌شود.
# • پورت ۳۰۰۰ میزبان رابط کاربری است (خروجی dev server با hot reload).
# • متغیرهای BASE44_* از محیط سندباکس به سرویس پاس داده می‌شوند و هرگز هاردکد نمی‌شوند.
# ---------------------------------------------------------------------------
services:
  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    environment:
      # در سندباکس Base44 مقدار ۱ است؛ کد فقط با همین مقدار دقیق فعال می‌شود.
      - BASE44_PREVIEW_MODE
      # برای allowlist میزبان‌های Vite (dev assets / HMR)
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    ports:
      - '3000:3000'
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s

volumes:
  web_node_modules:
