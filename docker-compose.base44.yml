services:
  web:
    image: node:22-slim
    working_dir: /app
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund && exec npm run dev
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s
    restart: on-failure

  api:
    image: node:22-slim
    working_dir: /app
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund && exec npm run dev
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
      - admin_data:/data
    environment:
      - PORT=4000
      - ADMIN_DATA_DIR=/data
      # Preview host suffixes, so the origin check accepts the public preview host.
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    # Platform-delivered secrets (ADMIN_USERNAME, ADMIN_PASSWORD) — no key here
    # is repeated under `environment:` so dashboard values always win.
    env_file:
      - /run/base44/app.env
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: on-failure

volumes:
  node_modules:
  server_node_modules:
  admin_data:
