; Sandbox/dev PHP settings. Production uses the host's php.ini — the recommended values for
; DirectAdmin are listed in backend/docs/DEPLOYMENT-DIRECTADMIN.md.
;
; Kept small on purpose: no debugger, no xdebug, no permissive error display (the API must never
; leak paths), and upload limits that match the application's own validation rules.

expose_php = Off
display_errors = Off
log_errors = On

memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 8M
post_max_size = 10M
max_file_uploads = 10

date.timezone = Asia/Tehran

; The framework's own config cache is used in production, never in the sandbox.
opcache.enable_cli = 0
